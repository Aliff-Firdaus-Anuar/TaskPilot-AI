<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskPilot AI</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar" class="sidebar hidden">
      <div class="sidebar-header">
        <h1 class="logo">TaskPilot <span class="logo-ai">AI</span></h1>
      </div>
      <nav class="sidebar-nav">
        <a href="#" data-route="dashboard" class="nav-link active">
          <span class="nav-icon">&#9632;</span>
          <span>Dashboard</span>
        </a>
        <a href="#" data-route="projects" class="nav-link">
          <span class="nav-icon">&#9776;</span>
          <span>Projects</span>
        </a>
        <a href="#" data-route="ai-assist" class="nav-link">
          <span class="nav-icon">&#9889;</span>
          <span>AI Assist</span>
        </a>
        <a href="#" data-route="guide" class="nav-link">
          <span class="nav-icon">&#63;</span>
          <span>Guide</span>
        </a>
        <a href="#" data-route="profile" class="nav-link">
          <span class="nav-icon">&#64;</span>
          <span>Profile</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <button id="logoutBtn" class="btn-logout">Logout</button>
      </div>
    </aside>

    <main id="mainContent" class="main-content">
      <header class="topbar">
        <button id="menuToggle" class="menu-toggle">&#9776;</button>
        <h2 id="pageTitle" class="page-title">Dashboard</h2>
        <div class="topbar-actions">
          <button id="notificationBell" class="btn-darkmode" title="Notifications">&#128276;</button>
          <button id="darkModeToggle" class="btn-darkmode" title="Toggle dark mode">&#9681;</button>
        </div>
      </header>
      <div id="viewContainer" class="view-container">
        <!-- Views rendered here by router -->
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.0/dist/umd/supabase.min.js"></script>
  <script src="js/config/supabase.js"></script>
  <script src="js/utils/helpers.js"></script>
  <script src="js/utils/router.js"></script>
  <script src="js/modules/auth.js"></script>
  <script src="js/modules/projects.js"></script>
  <script src="js/modules/tasks.js"></script>
  <script src="js/config/keys.js"></script>
  <script src="js/modules/ai.js"></script>
  <script src="js/modules/dashboard.js"></script>
  <script src="js/modules/guide.js"></script>
  <script src="js/modules/profile.js"></script>
  <script src="js/modules/team.js"></script>
  <script src="js/modules/activity.js"></script>
  <script src="js/modules/notifications.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
